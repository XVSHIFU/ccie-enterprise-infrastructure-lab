version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
!
hostname sw202
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
clock timezone EET 2 0
!
!
!
!
!
!
!
!
no ip domain-lookup
ip cef
no ipv6 cef
!
key chain ccie
 key 1
   key-string cci3
   cryptographic-algorithm hmac-sha-384
!
!
!
spanning-tree mode pvst
spanning-tree extend system-id
!
!
vlan 3999
 name "SDA Underlay"
!
vlan 4000
 name "SD-WAN Underlay"
no cdp run
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 10.2.255.202 255.255.255.255
 ip ospf 1 area 0
!
interface Ethernet0/0
 description https://ccielabcenter.com
 no switchport
 ip address 10.2.11.2 255.255.255.252
 ip ospf 1 area 0
 duplex full
!
interface Ethernet0/1
 description https://ccielabcenter.com
 no switchport
 ip address 10.2.13.2 255.255.255.252
 ip ospf 1 area 0
 duplex full
!
interface Ethernet0/2
 description https://ccielabcenter.com
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 4000
 switchport mode trunk
!
interface Ethernet0/3
 description https://ccielabcenter.com
 no switchport
 ip address 10.2.109.2 255.255.255.252
 ip ospf 1 area 0
 duplex full
!
interface Ethernet1/0
 description https://ccielabcenter.com
 no switchport
 ip address 10.2.22.1 255.255.255.252
 ip ospf 1 area 0
 duplex full
!
interface Ethernet1/1
 description https://ccielabcenter.com
 no switchport
 ip address 10.2.21.1 255.255.255.252
 ip ospf 1 area 0
 duplex full
!
interface Ethernet1/2
 description https://ccielabcenter.com
 no switchport
 ip address 10.2.242.1 255.255.255.252
 ip ospf authentication key-chain ccie
 ip ospf bfd
 ip ospf 1 area 0
 duplex full
 bfd interval 100 min_rx 100 multiplier 3
!
interface Ethernet1/3
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 4000
 switchport mode trunk
!
interface Ethernet2/0
!
interface Ethernet2/1
!
interface Ethernet2/2
!
interface Ethernet2/3
!
interface Vlan3999
 ip address 10.2.202.11 255.255.255.248
 ip mtu 1496
 ip ospf 1 area 0
!
interface Vlan4000
 ip address 10.2.202.3 255.255.255.248
 ip ospf prefix-suppression disable
 ip ospf 1 area 0
!
router ospf 1
!
ip forward-protocol nd
!
ip http server
ip http secure-server
!
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
!
!
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
line vty 0 4
 privilege level 15
 no login
 transport input all
!
!
!
end
