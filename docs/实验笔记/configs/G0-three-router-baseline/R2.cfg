version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
hostname R2
boot-start-marker
boot-end-marker
no aaa new-model
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
ip cef
no ipv6 cef
multilink bundle-name authenticated
redundancy
interface Loopback0
 ip address 10.255.0.2 255.255.255.255
 ip ospf 1 area 0
interface Ethernet0/0
 ip address 10.12.0.2 255.255.255.252
 ip ospf 1 area 0
 duplex auto
interface Ethernet0/1
 ip address 10.23.0.1 255.255.255.252
 duplex auto
interface Ethernet0/2
 no ip address
 shutdown
 duplex auto
interface Ethernet0/3
 no ip address
 shutdown
 duplex auto
router ospf 1
 router-id 2.2.2.2
 redistribute bgp 65001 metric 20 metric-type 1 subnets route-map BGP-TO-OSPF
 passive-interface default
 no passive-interface Ethernet0/0
router bgp 65001
 bgp router-id 2.2.2.2
 bgp log-neighbor-changes
 network 10.255.0.1 mask 255.255.255.255
 network 10.255.0.2 mask 255.255.255.255
 neighbor 10.23.0.2 remote-as 65002
ip forward-protocol nd
no ip http server
no ip http secure-server
ip prefix-list DC-LOOPBACK seq 10 permit 10.255.0.3/32
ipv6 ioam timestamp
route-map BGP-TO-OSPF permit 10
 match ip address prefix-list DC-LOOPBACK
control-plane
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
 transport input none
end
